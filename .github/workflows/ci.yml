name: CI

# neural-computer depends on sibling repos via local file: paths.
# Sibling SHAs are pinned so CI does not float on those defaults.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: neural-computer
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: danielsimonjr/memoryjs
          # v4.2.0 (chore(release): v4.2.0, on master).
          # 4.x made loadGraph() return a read-only borrowed view, deep-frozen
          # outside production. NC never calls loadGraph(): it consumes memoryjs
          # through types plus the ObservableDataModel adapter, which owns the
          # load. Bumped from af11456 (v3.4.0), which is what CI actually built
          # against while the local file: link already resolved to 4.2.0.
          ref: 2e10299f49447c14ff732196e05b9ed9b6a4169f
          path: memoryjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: danielsimonjr/JSON-UI
          # v0.2.0 + AnyCatalog, store.write, registry context (#3)
          ref: 6fa0f6966988db3cff8c726743028ae338a94976
          path: JSON-UI

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Build memoryjs
        working-directory: memoryjs
        run: bun install --frozen-lockfile && bun run build

      - name: Build JSON-UI (npm workspaces -> packages/{core,headless,react}/dist)
        working-directory: JSON-UI
        run: bun install --frozen-lockfile && bun run build

      - name: neural-computer typecheck / lint / test / build
        working-directory: neural-computer
        run: |
          python3 --version
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun run format:check
          bun run test
          bun run build
          test -f dist/worker.py
